<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Optical pump-terahertz probe measurement</title>
  <desc id="description">An optical pulse and a delayed terahertz pulse meet at a semiconductor thin film. The transmitted terahertz field is detected while the delay is scanned.</desc>
  <defs>
    <linearGradient id="pump" x1="76" y1="122" x2="314" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0BD78" stop-opacity=".28"/>
      <stop offset=".68" stop-color="#F0BD78"/>
      <stop offset="1" stop-color="#F0BD78" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="probe" x1="36" y1="290" x2="555" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54C9B8" stop-opacity=".22"/>
      <stop offset=".38" stop-color="#54C9B8"/>
      <stop offset="1" stop-color="#54C9B8" stop-opacity=".8"/>
    </linearGradient>
    <marker id="pump-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#F0BD78" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="probe-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#54C9B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M34 46H606M34 373H606" stroke="#78999A" stroke-opacity=".28"/>
  <text x="37" y="78" fill="#F0BD78" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">OPTICAL PUMP</text>
  <text x="37" y="344" fill="#7DDED1" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">THz PROBE</text>
  <text x="243" y="179" fill="#DCE9E7" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">THIN-FILM SAMPLE</text>
  <text x="516" y="344" fill="#DCE9E7" font-family="Trebuchet MS, sans-serif" font-size="17" font-weight="700">DETECT</text>

  <circle cx="83" cy="119" r="22" stroke="#F0BD78" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="83" cy="119" r="9" fill="#F0BD78"/>
  <path d="M103 133L307 284" stroke="#F0BD78" stroke-opacity=".12" stroke-width="21" stroke-linecap="round"/>
  <path d="M103 133L307 284" stroke="url(#pump)" stroke-width="4" stroke-linecap="round" marker-end="url(#pump-arrow)"/>
  <path d="M126 134L274 250M105 157L273 278" stroke="#F0BD78" stroke-opacity=".38" stroke-width="1.5"/>

  <path d="M43 289H300M351 289H535" stroke="#54C9B8" stroke-opacity=".14" stroke-width="20" stroke-linecap="round"/>
  <path d="M43 289H300M351 289H535" stroke="url(#probe)" stroke-width="4" stroke-linecap="round" marker-end="url(#probe-arrow)"/>
  <path d="M54 289C64 268 76 268 86 289S108 310 119 289S141 268 152 289S174 310 185 289S207 268 218 289S240 310 251 289S273 268 284 289" stroke="#7DDED1" stroke-width="2" stroke-opacity=".95"/>
  <path d="M357 289C367 268 379 268 390 289S412 310 423 289S445 268 456 289S478 310 489 289S511 268 522 289" stroke="#7DDED1" stroke-width="2" stroke-opacity=".95"/>

  <path d="M308 221L339 209V349L308 361V221Z" fill="#C5E3E0" fill-opacity=".15" stroke="#A5D5D0" stroke-width="1.5"/>
  <path d="M308 221L315 218V358L308 361V221Z" fill="#F0BD78" fill-opacity=".78"/>
  <path d="M315 218L339 209" stroke="#DCE9E7" stroke-width="1.5"/>
  <path d="M315 358L339 349" stroke="#DCE9E7" stroke-opacity=".75" stroke-width="1.5"/>

  <circle cx="564" cy="289" r="28" stroke="#7DDED1" stroke-width="2"/>
  <circle cx="564" cy="289" r="19" stroke="#7DDED1" stroke-opacity=".38"/>
  <path d="M547 289H554L559 279L566 300L572 284L577 289H581" stroke="#F0BD78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="146" cy="394" r="5" fill="#F0BD78"/>
  <circle cx="482" cy="394" r="5" fill="#54C9B8"/>
  <path d="M156 394H472" stroke="#A7C3C0" stroke-width="1.5" stroke-dasharray="5 7"/>
  <text x="225" y="419" fill="#B8D0CD" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="600">VARIABLE DELAY &#964;</text>
</svg>
