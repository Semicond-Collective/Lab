name: Sync Google Scholar publications

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    paths:
      - scholar-profile.json
      - .github/workflows/sync-scholar.yml

permissions:
  contents: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Scholar client
        run: python -m pip install scholarly==1.7.11 bibtexparser==1.4.3
      - name: Refresh publications
        run: python scripts/sync_scholar.py
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json scholar-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Google Scholar publications"
            git push
          fi
